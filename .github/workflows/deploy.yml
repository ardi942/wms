name: Deploy WMS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: wms-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, wms]
    timeout-minutes: 15
    steps:
      - name: Deploy
        run: /home/ardi/wms/scripts/deploy.sh
