name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms -d wms"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://wms:wms@localhost:5432/wms?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: backend
      - name: vet
        run: go vet ./...
        working-directory: backend
      - name: unit tests
        run: go test -short -race -shuffle=on ./...
        working-directory: backend
      - name: integration tests
        run: go test -shuffle=on ./test/api ./test/security ./test/outbox ./test/worker
        working-directory: backend
      - name: concurrency tests
        run: go test -race -count=5 ./test/concurrency
        working-directory: backend
      - name: install security/static tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...
        working-directory: backend
      - name: gosec
        run: $(go env GOPATH)/bin/gosec -exclude-generated ./...
        working-directory: backend
      - name: govulncheck
        run: $(go env GOPATH)/bin/govulncheck ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
